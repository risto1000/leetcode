name: Sync LeetCode

on:
  workflow_dispatch:
  schedule:
    # Ajaa synkronoinnin automaattisesti kerran viikossa (lauantaisin klo 08:00 UTC)
    - cron: "0 8 * * 6"

jobs:
  sync:
    runs-on: ubuntu-latest

    # Varmistetaan kirjoitusoikeudet repositorio-committeja varten
    permissions:
      contents: write

    steps:
      - name: Sync LeetCode submissions
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: solutions
          verbose: true
          commit-header: "[LeetCode Sync]"
